<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendwise — Smart Spending Analyzer</title>

  <!-- High-legibility modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              400: '#34d399',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            },
            sand: {
              50: '#f8fafc',  /* Ultra-clean slate background */
              100: '#f1f5f9', /* Table zebra stripes / hover states */
              200: '#cbd5e1', /* Crisp, clearly visible borders */
            },
            ink: '#0f172a',   /* Deep, crystal-clear Slate 900 text */
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    /* Universal Base & Typography Enhancements */
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f8fafc;
      color: #0f172a;
    }

    /* All form inputs: ensure clear contrast, crisp borders, legible text in all themes */
    input:not([type='checkbox']):not([type='radio']),
    select,
    textarea {
      background-color: #ffffff;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
      border-width: 1.5px !important;
      font-weight: 500;
      transition: all 0.15s ease-in-out;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #059669 !important;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2) !important;
      outline: none !important;
    }

    input::placeholder,
    textarea::placeholder {
      color: #64748b !important;
      font-weight: 400;
    }

    /* High contrast table styling */
    table thead th {
      color: #334155 !important;
      font-weight: 700 !important;
      letter-spacing: 0.05em;
    }

    /* Crisp card elevation */
    .bg-white {
      border-color: #cbd5e1 !important;
      box-shadow: 0 2px 8px -1px rgba(15, 23, 42, 0.06), 0 1px 4px -1px rgba(15, 23, 42, 0.04);
    }

    /* Refined labels & text */
    .text-gray-400 {
      color: #475569 !important; /* Bump from washed out #9ca3af to readable #475569 */
      font-weight: 600;
    }
    .text-gray-500 {
      color: #334155 !important; /* Bump to sharp #334155 */
      font-weight: 500;
    }
    .text-gray-600 {
      color: #1e293b !important; /* Bump to rich #1e293b */
      font-weight: 500;
    }
    .text-gray-700 {
      color: #0f172a !important; /* Deepest contrast for labels */
      font-weight: 600;
    }

    /* Dark Mode Theme Overrides - High Contrast & High Legibility */
    html.dark body {
      background-color: #090d16;
      color: #f8fafc;
    }
    html.dark aside,
    html.dark header,
    html.dark #mobile-nav,
    html.dark .bg-white\/80,
    html.dark .bg-white\/90 {
      background-color: #0f172a !important;
      border-color: #1e293b !important;
    }
    html.dark .bg-sand-50 {
      background-color: #090d16 !important;
    }
    html.dark .bg-white {
      background-color: #111827 !important;
      border-color: #1f2d45 !important;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5) !important;
    }
    html.dark .bg-sand-100 {
      background-color: #182238 !important;
    }
    html.dark .bg-sand-200 {
      background-color: #22304d !important;
    }
    html.dark .bg-teal-50 {
      background-color: rgba(5, 150, 105, 0.2) !important;
    }
    html.dark .bg-teal-600 {
      background-color: #059669 !important;
    }
    html.dark .border-sand-100 {
      border-color: #1e293b !important;
    }
    html.dark .border-sand-200 {
      border-color: #273652 !important;
    }
    html.dark .border-teal-200 {
      border-color: #065f46 !important;
    }
    html.dark .text-ink {
      color: #f8fafc !important;
    }
    html.dark .text-gray-700 {
      color: #f1f5f9 !important;
    }
    html.dark .text-gray-600 {
      color: #e2e8f0 !important;
    }
    html.dark .text-gray-500 {
      color: #cbd5e1 !important;
    }
    html.dark .text-gray-400 {
      color: #94a3b8 !important;
    }
    html.dark .text-teal-900 {
      color: #34d399 !important;
    }
    html.dark .text-teal-700 {
      color: #10b981 !important;
    }
    html.dark input:not([type='checkbox']):not([type='radio']),
    html.dark select,
    html.dark textarea {
      background-color: #182238 !important;
      color: #f8fafc !important;
      border-color: #334466 !important;
    }
    html.dark input:focus,
    html.dark select:focus,
    html.dark textarea:focus {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3) !important;
    }
    html.dark input::placeholder,
    html.dark textarea::placeholder {
      color: #64748b !important;
    }
    html.dark table thead th {
      color: #cbd5e1 !important;
    }
    html.dark thead.bg-sand-50 {
      background-color: #131b2e !important;
    }
    html.dark option {
      background-color: #182238;
      color: #f8fafc;
    }
    html.dark .hover\:bg-sand-100:hover {
      background-color: #1e2b45 !important;
    }
    html.dark .hover\:bg-teal-900:hover {
      background-color: #047857 !important;
    }
    html.dark .hover\:bg-sand-200:hover {
      background-color: #273652 !important;
    }

    /* Custom smooth scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    html.dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    /* Modern Fluid Animations & Micro-interactions */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.05);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-pop-in {
      animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Interactive Card & Element Transitions */
    .card-hover {
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, border-color 0.22s ease;
    }
    .card-hover:hover {
      transform: translateY(-2.5px);
      box-shadow: 0 12px 24px -4px rgba(15, 23, 42, 0.08), 0 4px 8px -2px rgba(15, 23, 42, 0.04);
    }
    html.dark .card-hover:hover {
      box-shadow: 0 14px 28px -4px rgba(0, 0, 0, 0.6), 0 4px 10px -2px rgba(0, 0, 0, 0.4);
      border-color: #3b82f6 !important;
    }

    /* Button click spring feel */
    button:active:not(:disabled) {
      transform: scale(0.975);
    }
  </style>
</head>
<body class="bg-sand-50 text-ink antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
